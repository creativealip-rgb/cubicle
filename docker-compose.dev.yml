name: cubicle-dev

services:
  cubicle-dev-redis:
    image: redis:7-alpine
    container_name: cubicle-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - dokploy-network
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  cubicle-dev:
    image: cubicle-dev:prod
    container_name: cubicle-dev
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: https://dev.cubiqlo.com
        VCS_REF: ${VCS_REF:-dev-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - .env.development.local
    environment:
      NODE_ENV: production
      PORT: "3100"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: https://dev.cubiqlo.com
      BETTER_AUTH_URL: https://dev.cubiqlo.com
      CUBIQLO_ENV: development
      RESEND_API_KEY: ""
      EMAIL_FROM: "Cubiqlo Dev <dev@localhost>"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-ag/gemini-3-flash}
      OPENAI_API_KEY: ""
      # CRON_SECRET is intentionally NOT pinned here: an empty value in
      # `environment:` would override (and null out) the secret coming from
      # `.env.development.local` (env_file), 503-ing every /api/cron/* route
      # in dev. The env_file value guards all cron endpoints; see
      # docs/operations/storage-quota-reconcile-cron.md.
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_TOKEN_ENCRYPTION_KEY: ""
      RATE_LIMIT_REDIS_URL: redis://cubicle-dev-redis:6379
    networks:
      - dokploy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - cubicle-dev-redis

networks:
  dokploy-network:
    external: true
